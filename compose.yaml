services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urabaconecta}
      POSTGRES_USER: ${POSTGRES_USER:-urabaconecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uraba_dev_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - urabaconecta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  urabaconecta_pgdata:
